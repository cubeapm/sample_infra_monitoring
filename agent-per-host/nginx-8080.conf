# Same as ../nginx.conf, listening on 8080 instead of 80 - needed so a second
# nginx can run in the SAME network namespace as the first (two processes on
# one host can't both bind port 80). Used only by docker-compose-multi-instance.yml.
worker_processes auto;
events {
    worker_connections 1024;
}
http {
    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;

        location = /status {
                stub_status;
        }
    }
}
